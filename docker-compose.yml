services:
  monitor:
    image: ghcr.io/diptamahardhika/homelab-monitor:latest
    # build: .                          # uncomment to build locally instead
    container_name: homelab-monitor
    ports:
      - "9876:9876"
    environment:
      # Generate one with: openssl rand -hex 32
      # Keep it in a .env file next to this compose file (already gitignored).
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - homelab-monitor-data:/app/data
      # mount your config.yaml to override defaults:
      # - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

volumes:
  homelab-monitor-data:
