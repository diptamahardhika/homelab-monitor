<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="HomeLab Monitor — your homelab at a glance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0B0D"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <path d="M 80,235 L 130,200 L 180,215 L 230,170 L 280,190 L 330,150 L 380,175 L 430,130 L 480,160 L 530,115 L 580,145 L 630,100 L 680,130 L 730,85 L 780,115 L 830,70 L 880,100 L 930,55 L 980,85 L 1030,45 L 1080,75 L 1120,55 L 1120,300 L 80,300 Z" fill="url(#fill)"/>

  <polyline
    points="80,235 130,200 180,215 230,170 280,190 330,150 380,175 430,130 480,160 530,115 580,145 630,100 680,130 730,85 780,115 830,70 880,100 930,55 980,85 1030,45 1080,75 1120,55"
    fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline
    points="80,235 130,200 180,215 230,170 280,190 330,150 380,175 430,130 480,160 530,115 580,145 630,100 680,130 730,85 780,115 830,70 880,100 930,55 980,85 1030,45 1080,75 1120,55"
    fill="none" stroke="url(#pulse)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>

  <circle cx="1120" cy="55" r="6" fill="#22c55e"/>
  <circle cx="1120" cy="55" r="12" fill="#22c55e" opacity="0.25"/>

  <text x="80" y="150" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700">HomeLab Monitor</text>
  <text x="80" y="195" fill="#9CA3AF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">Servers · Services · Containers · System health — at a glance</text>

  <g>
    <rect x="930" y="215" width="190" height="34" rx="17" fill="#141821" stroke="#6EA8FE" stroke-opacity="0.35"/>
    <circle cx="954" cy="232" r="4" fill="#22c55e"/>
    <text x="968" y="237" fill="#6EA8FE" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">self-hosted · live</text>
  </g>
</svg>
