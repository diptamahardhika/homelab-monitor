port: 9876

servers:
  - name: Localhost
    host: host.docker.internal
    port: 22
    type: tcp

  - name: Docker Host
    # gateway: docker auto-resolves the bridge gateway IP via the Docker socket.
    # This reaches the host machine reliably across Docker Desktop, WSL2, and Linux.
    host: host.docker.internal
    port: 9000
    type: tcp
    gateway: docker

services:
  - name: Example HTTP
    url: https://example.com
    type: http
