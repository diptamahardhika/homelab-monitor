port: 9876

# Optional history tuning (defaults shown). Sampling throttles how often the
# 3s live poll is written to the uptime/trend stores.
history_sampling_seconds: 60
history_retention_days: 30
system_history_days: 7

servers:
  - name: Localhost
    host: host.docker.internal
    port: 22
    type: tcp

  - name: Docker Host
    # gateway: docker auto-resolves the bridge gateway IP via the Docker socket.
    # This reaches the host machine reliably across Docker Desktop, WSL2, and Linux.
    host: host.docker.internal
    port: 9000
    type: tcp
    gateway: docker

services:
  - name: Example HTTP
    url: https://example.com
    type: http
